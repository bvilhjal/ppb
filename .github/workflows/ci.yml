name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ppb requires Python >= 3.11; the code is version-agnostic. These are
        # the versions with reliable numba wheels on PyPI (the dev env uses 3.14
        # via conda). Add "3.13"/"3.14" here once numba ships stable pip wheels.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff
      - name: Lint
        run: ruff check .
      - name: Report drift
        # No LaTeX toolchain on the runner; this compares git commit times
        # so a revised .tex can never silently trail the committed PDF.
        run: python scripts/check_report_drift.py
      - name: Test
        # The family pins BLAS threads so numerics (and seed-dispersion
        # margins measured against them) are deterministic.
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest -q
